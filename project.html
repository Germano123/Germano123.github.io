<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estudo de caso e detalhe técnico do projeto — Cozy Developer Laboratory.">
    <title>Estudo de Caso | Germano Cozy Dev Lab</title>
    <!-- Google Fonts for Cozy Rounded Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header id="site-header-mount"></header>

    <main class="page-shell">
        <div id="case-study-mount">
            <!-- Conteúdo montado dinamicamente -->
        </div>
    </main>

    <footer id="site-footer-mount"></footer>

    <!-- Scripts da Aplicação -->
    <script src="js/data/projects.js"></script>
    <script src="js/data/areas.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/projects-service.js"></script>
    <script src="js/components.js"></script>

    <script>
      let currentGallery = [];
      let currentGalleryIndex = 0;

      function getSlugFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('slug') || params.get('id');
      }

      function getLocText(val, lang) {
        if (!val) return '';
        if (typeof val === 'string') return val;
        return val[lang] || val.pt || '';
      }

      function openLightbox(index) {
        if (!currentGallery || currentGallery.length === 0) return;
        currentGalleryIndex = (index + currentGallery.length) % currentGallery.length;
        const item = currentGallery[currentGalleryIndex];
        const modal = document.getElementById('project-lightbox');
        const img = document.getElementById('lightbox-img');
        const cap = document.getElementById('lightbox-caption');
        const counter = document.getElementById('lightbox-counter');
        const lang = getLanguage();

        if (!modal || !img) return;

        img.src = item.url;
        img.alt = item.alt || '';
        if (cap) cap.textContent = getLocText(item.caption, lang);
        if (counter) counter.textContent = `${currentGalleryIndex + 1} ${t('imageOf')} ${currentGallery.length}`;

        modal.classList.add('active');
        modal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        const modal = document.getElementById('project-lightbox');
        if (!modal) return;
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      function nextLightboxImage() {
        openLightbox(currentGalleryIndex + 1);
      }

      function prevLightboxImage() {
        openLightbox(currentGalleryIndex - 1);
      }

      function renderProjectGallery(project, lang) {
        if (!project.gallery || project.gallery.length === 0) return '';

        const cardsHtml = project.gallery.map((img, idx) => {
          const caption = getLocText(img.caption, lang);
          return `
            <div class="gallery-card" data-gallery-index="${idx}" tabindex="0" role="button" aria-label="${caption || t('viewImageFull')}">
              <div class="gallery-thumb-wrapper">
                <img src="${img.url}" alt="${img.alt || project.title}" class="gallery-thumb" loading="lazy">
                <span class="gallery-zoom-badge" aria-hidden="true">🔍 ${idx + 1}</span>
              </div>
              ${caption ? `<div class="gallery-card-caption">${caption}</div>` : ''}
            </div>
          `;
        }).join('');

        return `
          <section class="case-study-section project-gallery-section">
            <h2 class="case-study-section-title">🖼️ ${t('projectGalleryTitle')}</h2>
            <p style="color: var(--color-cream-muted); font-size: 0.95rem; margin-top: -6px;">${t('projectGalleryDesc')}</p>
            <div class="project-gallery-grid">
              ${cardsHtml}
            </div>
          </section>
        `;
      }

      function renderToolsLabSection(project, lang) {
        if (project.projectType !== 'tool' && !project.pipelineFlow && !project.workflowContext) return '';

        let html = '';

        if (project.workflowContext) {
          const audience = getLocText(project.workflowContext.targetAudience, lang);
          const painPoint = getLocText(project.workflowContext.painPoint, lang);
          const metric = project.workflowContext.timeSavedMetric;

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">⏱️ ${t('toolsWorkflowTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 12px;">
                  <div style="background: var(--bg-card-inner); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                    <strong style="color: var(--color-orange-light); font-size: 0.9rem;">${t('toolsTargetAudience')}</strong>
                    <p style="margin: 6px 0 0 0; color: var(--color-cream); font-size: 0.95rem;">${audience}</p>
                  </div>
                  ${metric ? `
                    <div style="background: var(--bg-card-inner); padding: 14px 18px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                      <strong style="color: var(--color-orange-light); font-size: 0.9rem;">${t('toolsTimeSaved')}</strong>
                      <p style="margin: 6px 0 0 0; color: var(--color-green-light); font-size: 1.05rem; font-weight: 600;">${metric}</p>
                    </div>
                  ` : ''}
                </div>
                <p><strong>${t('toolsPainPoint')}:</strong> ${painPoint}</p>
              </div>
            </section>
          `;
        }

        if (project.pipelineFlow) {
          const inputsList = (project.pipelineFlow.inputs || []).map(i => `<li>${getLocText(i, lang)}</li>`).join('');
          const outputsList = (project.pipelineFlow.outputs || []).map(o => `<li>${getLocText(o, lang)}</li>`).join('');
          const logic = getLocText(project.pipelineFlow.processingLogic, lang);

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🔄 ${t('toolsPipelineTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 14px;">
                  <div style="background: var(--bg-card-inner); padding: 16px; border-radius: var(--radius-sm); border-left: 3px solid var(--color-orange);">
                    <strong style="color: var(--color-orange-light); font-size: 0.9rem;">${t('toolsInputs')}</strong>
                    <ul style="margin: 8px 0 0 18px; padding: 0; font-size: 0.92rem; color: var(--color-cream-muted);">${inputsList}</ul>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 16px; border-radius: var(--radius-sm); border-left: 3px solid var(--color-green);">
                    <strong style="color: var(--color-green-light); font-size: 0.9rem;">${t('toolsOutputs')}</strong>
                    <ul style="margin: 8px 0 0 18px; padding: 0; font-size: 0.92rem; color: var(--color-cream-muted);">${outputsList}</ul>
                  </div>
                </div>
                <p><strong>${t('toolsProcessing')}:</strong> ${logic}</p>
              </div>
            </section>
          `;
        }

        if (project.technicalArchitecture) {
          const dataTags = (project.technicalArchitecture.dataStructures || []).map(d => `<span class="tech-tag">${d}</span>`).join(' ');
          const editorTags = (project.technicalArchitecture.editorIntegrations || []).map(e => `<span class="tech-tag">${e}</span>`).join(' ');
          const safety = getLocText(project.technicalArchitecture.safetyFeatures, lang);

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🔧 ${t('toolsArchitectureTitle')}</h2>
              <div class="case-study-section-content">
                <div style="margin-bottom: 12px;">
                  <strong>${t('toolsDataStructures')}:</strong>
                  <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;">${dataTags}</div>
                </div>
                <div style="margin-bottom: 12px;">
                  <strong>${t('toolsIntegrations')}:</strong>
                  <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;">${editorTags}</div>
                </div>
                <p><strong>${t('toolsSafety')}:</strong> ${safety}</p>
              </div>
            </section>
          `;
        }

        return html;
      }

      function renderArtWorkshopSection(project, lang) {
        if (project.projectType !== 'art' && !project.technicalArtBudget) return '';

        let html = '';

        if (project.technicalArtBudget) {
          const b = project.technicalArtBudget;
          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">📐 ${t('artBudgetTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px;">
                  <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                    <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artTriangles')}</div>
                    <div style="font-size: 1.3rem; font-weight: 600; color: var(--color-orange-light);">${b.triangleCount.toLocaleString()}</div>
                  </div>
                  ${b.vertexCount ? `
                    <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                      <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artVertices')}</div>
                      <div style="font-size: 1.3rem; font-weight: 600; color: var(--color-cream);">${b.vertexCount.toLocaleString()}</div>
                    </div>
                  ` : ''}
                  <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                    <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artMaterials')}</div>
                    <div style="font-size: 1.3rem; font-weight: 600; color: var(--color-green-light);">${b.materialCount}</div>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                    <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artDrawCalls')}</div>
                    <div style="font-size: 1.3rem; font-weight: 600; color: var(--color-green-light);">${b.drawCallsEstimated}</div>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                    <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artTexture')}</div>
                    <div style="font-size: 0.95rem; font-weight: 600; color: var(--color-cream); margin-top: 4px;">${b.textureResolution}</div>
                  </div>
                  ${b.uvEfficiencyPercent ? `
                    <div style="background: var(--bg-card-inner); padding: 12px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--color-border);">
                      <div style="font-size: 0.8rem; color: var(--color-cream-muted);">${t('artUvEfficiency')}</div>
                      <div style="font-size: 1.3rem; font-weight: 600; color: var(--color-orange-light);">${b.uvEfficiencyPercent}%</div>
                    </div>
                  ` : ''}
                </div>
              </div>
            </section>
          `;
        }

        if (project.shadingSetup) {
          const summary = getLocText(project.shadingSetup.techniqueSummary, lang);
          const featuresTags = (project.shadingSetup.features || []).map(f => `<span class="tech-tag">${f}</span>`).join(' ');

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">✨ ${t('artShadingTitle')}</h2>
              <div class="case-study-section-content">
                <p>${summary}</p>
                <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;">${featuresTags}</div>
              </div>
            </section>
          `;
        }

        if (project.riggingAnimationDetails) {
          const r = project.riggingAnimationDetails;
          const clipsRows = (r.clips || []).map(c => `
            <tr>
              <td style="padding: 8px 12px; border-bottom: 1px solid var(--color-border); font-weight: 500;">${c.name}</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid var(--color-border);">${c.frameCount} frames</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid var(--color-border);">${c.fps} FPS</td>
              <td style="padding: 8px 12px; border-bottom: 1px solid var(--color-border); color: ${c.looping ? 'var(--color-green-light)' : 'var(--color-cream-muted)'};">${c.looping ? t('artLoop') : t('artOnce')}</td>
            </tr>
          `).join('');

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🦴 ${t('artRiggingTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: flex; gap: 16px; margin-bottom: 12px;">
                  ${r.boneCount ? `<span><strong>${t('artBones')}:</strong> ${r.boneCount}</span>` : ''}
                  <span><strong>${t('artIK')}:</strong> ${r.hasIKControls ? 'Sim / Yes' : 'Não / No'}</span>
                </div>
                ${clipsRows ? `
                  <div style="overflow-x: auto; margin-top: 12px;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: left; background: var(--bg-card-inner); border-radius: var(--radius-sm);">
                      <thead>
                        <tr style="border-bottom: 2px solid var(--color-border); color: var(--color-orange-light);">
                          <th style="padding: 8px 12px;">Clip Name</th>
                          <th style="padding: 8px 12px;">Frames</th>
                          <th style="padding: 8px 12px;">Rate</th>
                          <th style="padding: 8px 12px;">Mode</th>
                        </tr>
                      </thead>
                      <tbody>${clipsRows}</tbody>
                    </table>
                  </div>
                ` : ''}
              </div>
            </section>
          `;
        }

        return html;
      }

      function renderGamePrototypeSection(project, lang) {
        if (project.projectType !== 'game' && !project.gameFeelDetails && !project.gameplayProfile) return '';

        let html = '';

        if (project.gameplayProfile) {
          const genre = getLocText(project.gameplayProfile.genre, lang);
          const controls = getLocText(project.gameplayProfile.controlsSummary, lang);
          const platforms = (project.gameplayProfile.targetPlatform || []).join(', ');

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🎮 ${t('gameProfileTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px;">
                  <div style="background: var(--bg-card-inner); padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                    <strong style="color: var(--color-orange-light); font-size: 0.85rem;">${t('gameGenre')}</strong>
                    <div style="margin-top: 4px; font-size: 0.95rem; color: var(--color-cream);">${genre}</div>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                    <strong style="color: var(--color-orange-light); font-size: 0.85rem;">${t('gamePerspective')}</strong>
                    <div style="margin-top: 4px; font-size: 0.95rem; color: var(--color-cream); text-transform: capitalize;">${project.gameplayProfile.cameraPerspective}</div>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
                    <strong style="color: var(--color-orange-light); font-size: 0.85rem;">${t('gamePlatform')}</strong>
                    <div style="margin-top: 4px; font-size: 0.95rem; color: var(--color-cream);">${platforms}</div>
                  </div>
                </div>
                <p><strong>${t('gameControls')}:</strong> ${controls}</p>
              </div>
            </section>
          `;
        }

        if (project.gameFeelDetails) {
          const moveList = (project.gameFeelDetails.movementMechanics || []).map(m => `<li>${getLocText(m, lang)}</li>`).join('');
          const tactileList = (project.gameFeelDetails.tactileFeedback || []).map(tf => `<li>${getLocText(tf, lang)}</li>`).join('');
          const avSync = getLocText(project.gameFeelDetails.soundVisualSync, lang);

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">✨ ${t('gameFeelTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 12px;">
                  <div style="background: var(--bg-card-inner); padding: 16px; border-radius: var(--radius-sm); border-left: 3px solid var(--color-orange);">
                    <strong style="color: var(--color-orange-light); font-size: 0.9rem;">${t('gameMovement')}</strong>
                    <ul style="margin: 8px 0 0 18px; padding: 0; font-size: 0.92rem; color: var(--color-cream-muted);">${moveList}</ul>
                  </div>
                  <div style="background: var(--bg-card-inner); padding: 16px; border-radius: var(--radius-sm); border-left: 3px solid var(--color-green);">
                    <strong style="color: var(--color-green-light); font-size: 0.9rem;">${t('gameTactile')}</strong>
                    <ul style="margin: 8px 0 0 18px; padding: 0; font-size: 0.92rem; color: var(--color-cream-muted);">${tactileList}</ul>
                  </div>
                </div>
                ${avSync ? `<p><strong>${t('gameAudioVisual')}:</strong> ${avSync}</p>` : ''}
              </div>
            </section>
          `;
        }

        if (project.systemsArchitecture) {
          const engine = getLocText(project.systemsArchitecture.engineArchitecture, lang);
          const data = getLocText(project.systemsArchitecture.dataDrivenDesign, lang);
          const decoupling = getLocText(project.systemsArchitecture.decouplingStrategy, lang);

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🕹️ ${t('gameSystemsTitle')}</h2>
              <div class="case-study-section-content">
                <p><strong>Arquitetura de Engine:</strong> ${engine}</p>
                <p><strong>Design Orientado a Dados:</strong> ${data}</p>
                <p><strong>Desacoplamento:</strong> ${decoupling}</p>
              </div>
            </section>
          `;
        }

        return html;
      }

      function renderSoftwareShelfSection(project, lang) {
        if (project.projectType !== 'software' && !project.architectureDetails) return '';

        let html = '';

        if (project.architectureDetails) {
          const patternsTags = (project.architectureDetails.designPatterns || []).map(p => `<span class="tech-tag">${p}</span>`).join(' ');
          const modularity = getLocText(project.architectureDetails.modularityOverview, lang);
          const depPolicy = getLocText(project.architectureDetails.dependencyPolicy, lang);

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🏛️ ${t('softwareArchTitle')}</h2>
              <div class="case-study-section-content">
                <div style="margin-bottom: 12px;">
                  <strong>${t('softwarePatterns')}:</strong>
                  <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;">${patternsTags}</div>
                </div>
                <p><strong>${t('softwareModularity')}:</strong> ${modularity}</p>
                <p><strong>Política de Dependências:</strong> ${depPolicy}</p>
              </div>
            </section>
          `;
        }

        if (project.qualityAndReliability) {
          const q = project.qualityAndReliability;
          const benchList = (q.performanceBenchmarks || []).map(b => `
            <li><strong>${b.metricName}:</strong> ${b.measuredValue} ${b.comparisonBaseline ? `(${b.comparisonBaseline})` : ''}</li>
          `).join('');

          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">🧪 ${t('softwareQualityTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: flex; gap: 20px; margin-bottom: 12px;">
                  ${q.testCoveragePercentage ? `<span><strong>${t('softwareCoverage')}:</strong> <span style="color: var(--color-green-light); font-weight: 600;">${q.testCoveragePercentage}%</span></span>` : ''}
                  ${q.testingFramework ? `<span><strong>Framework:</strong> ${q.testingFramework}</span>` : ''}
                </div>
                ${benchList ? `
                  <div>
                    <strong>Benchmarks:</strong>
                    <ul style="margin: 6px 0 0 18px; padding: 0;">${benchList}</ul>
                  </div>
                ` : ''}
              </div>
            </section>
          `;
        }

        if (project.distributionDetails) {
          const d = project.distributionDetails;
          html += `
            <section class="case-study-section">
              <h2 class="case-study-section-title">📦 ${t('softwareDistributionTitle')}</h2>
              <div class="case-study-section-content">
                <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                  ${d.packageManager ? `<span><strong>Gerenciador:</strong> ${d.packageManager}</span>` : ''}
                  <span><strong>Versão:</strong> ${d.semanticVersion}</span>
                  <span><strong>Licença:</strong> ${d.license}</span>
                </div>
              </div>
            </section>
          `;
        }

        return html;
      }

      function renderCaseStudy() {
        const slug = getSlugFromUrl();
        const project = ProjectsService.getBySlug(slug);
        const lang = getLanguage();

        const primaryArea = (project && project.areas && project.areas[0]) || 'shelf';
        Components.renderHeader(primaryArea);
        Components.renderFooter();

        const mount = document.getElementById('case-study-mount');
        if (!mount || typeof ProjectsService === 'undefined') return;

        if (!project) {
          mount.innerHTML = `
            ${Components.renderEmptyState(
              'Projeto não encontrado / Project not found',
              'O estudo de caso solicitado não existe ou ainda não possui autorização de visibilidade pública.',
              '🔍'
            )}
          `;
          return;
        }

        // Título dinâmico da página
        document.title = `${project.title} | Germano Cozy Dev Lab`;

        const summary = project.summary[lang] || project.summary.pt;
        const problem = project.problem ? (project.problem[lang] || project.problem.pt) : null;
        const solution = project.solution ? (project.solution[lang] || project.solution.pt) : null;
        const contributions = project.contributions ? (project.contributions[lang] || project.contributions.pt) : null;
        const technicalDetails = project.technicalDetails ? (project.technicalDetails[lang] || project.technicalDetails.pt) : null;
        const results = project.results ? (project.results[lang] || project.results.pt) : null;

        const techTagsHtml = (project.technologies || [])
          .map(t => `<span class="tech-tag">${t}</span>`)
          .join('');

        const statusLabel = t(`status${project.status.charAt(0).toUpperCase() + project.status.slice(1).replace('-', '')}`) || project.status;

        // Determinar destino de retorno contextual
        let backUrl = 'software-shelf.html';
        if (primaryArea === 'art-workshop') backUrl = 'art-workshop.html';
        else if (primaryArea === 'tools-lab') backUrl = 'tools-lab.html';
        else if (primaryArea === 'games-prototypes') backUrl = 'games-prototypes.html';

        // Armazenar galeria global para lightbox
        currentGallery = project.gallery || [];

        // Configuração de Parceria / Natureza do Projeto
        const collabType = project.collaborationType || 'pessoal';
        let collabLabel = t('collabPersonal');
        let collabIcon = '👤';
        if (collabType === 'parceria') {
          collabLabel = t('collabPartnership');
          collabIcon = '🤝';
        } else if (collabType === 'estudo') {
          collabLabel = t('collabStudy');
          collabIcon = '📖';
        }

        const ribbonHtml = `
          <div class="case-study-ribbon-wrapper" aria-label="${collabLabel}">
            <div class="case-study-ribbon case-study-ribbon--${collabType}">
              <span>${collabIcon}</span>
              <span>${collabLabel}</span>
            </div>
          </div>
        `;

        let partnerMetaHtml = '';
        if (project.partner) {
          partnerMetaHtml = `
            <span class="collab-meta-badge collab-meta-badge--${collabType}">
              🤝 ${t('collabPartnerPrefix')} <strong>${project.partner}</strong>
            </span>
          `;
        } else {
          partnerMetaHtml = `
            <span class="collab-meta-badge collab-meta-badge--${collabType}">
              ${collabIcon} ${collabLabel}
            </span>
          `;
        }

        // Renderização dos blocos especializados
        const specializedToolsHtml = renderToolsLabSection(project, lang);
        const specializedArtHtml = renderArtWorkshopSection(project, lang);
        const specializedGameHtml = renderGamePrototypeSection(project, lang);
        const specializedSoftwareHtml = renderSoftwareShelfSection(project, lang);
        const galleryHtml = renderProjectGallery(project, lang);

        mount.innerHTML = `
          <article class="case-study case-study--${collabType}">
            ${ribbonHtml}

            <!-- 1. Header do Estudo de Caso (Título e Metadados) -->
            <header class="case-study-header">
              <a href="${backUrl}" class="btn btn-ghost" style="align-self: flex-start; padding: 4px 14px; font-size: 0.85rem;">
                ${t('btnBackToArea')}
              </a>
              <h1 class="case-study-title">${project.title}</h1>
              <div class="case-study-meta">
                <span class="project-status-badge status-${project.status}">${statusLabel}</span>
                ${partnerMetaHtml}
                <div class="project-tech-tags">${techTagsHtml}</div>
              </div>
            </header>

            <!-- 2. Visual First: Mídia Principal / Capa com evidência visual direta -->
            <div class="case-study-cover" style="margin-top: 8px;">
              <img src="${project.cover || 'assets/background.jpg'}" alt="${project.title}" loading="eager">
            </div>

            <!-- 3. Resumo Executivo / Declaração de Propósito -->
            <div class="case-study-summary" style="background-color: var(--bg-card); border-left: 4px solid var(--wood-light); border-radius: var(--radius-md); padding: 20px 24px; border: 1px solid var(--color-border); border-left-width: 4px;">
              <p style="font-size: 1.12rem; color: var(--color-cream); line-height: 1.65; margin: 0;">${summary}</p>
            </div>

            <!-- 4. Galeria de Imagens do Projeto (4+ Imagens com Lightbox) -->
            ${galleryHtml}

            <!-- 5. Contexto & Desafio -->
            ${problem ? `
              <section class="case-study-section">
                <h2 class="case-study-section-title">${t('caseStudyProblem')}</h2>
                <div class="case-study-section-content"><p>${problem}</p></div>
              </section>
            ` : ''}

            <!-- 6. Blocos Especializados Conforme a Disciplina do Projeto -->
            ${specializedToolsHtml}
            ${specializedArtHtml}
            ${specializedGameHtml}
            ${specializedSoftwareHtml}

            <!-- 7. Solução Técnica & Arquitetura Geral -->
            ${solution ? `
              <section class="case-study-section">
                <h2 class="case-study-section-title">${t('caseStudySolution')}</h2>
                <div class="case-study-section-content"><p>${solution}</p></div>
              </section>
            ` : ''}

            <!-- 8. Contribuição Individual -->
            ${contributions ? `
              <section class="case-study-section">
                <h2 class="case-study-section-title">${t('caseStudyContributions')}</h2>
                <div class="case-study-section-content"><p>${contributions}</p></div>
              </section>
            ` : ''}

            <!-- 9. Breakdown Técnico Detalhado -->
            ${technicalDetails ? `
              <section class="case-study-section">
                <h2 class="case-study-section-title">${t('caseStudyTechnical')}</h2>
                <div class="case-study-section-content"><p>${technicalDetails}</p></div>
              </section>
            ` : ''}

            <!-- 10. Resultados & Limitações Observadas -->
            ${results ? `
              <section class="case-study-section">
                <h2 class="case-study-section-title">${t('caseStudyResults')}</h2>
                <div class="case-study-section-content"><p>${results}</p></div>
              </section>
            ` : ''}

            <!-- 11. Ações e Links Externos Verificáveis -->
            <footer class="case-study-actions">
              ${project.repositoryUrl ? `
                <a href="${project.repositoryUrl}" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
                  <span>GitHub</span>
                  <span>↗</span>
                </a>
              ` : ''}
              ${project.buildUrl ? `
                <a href="${project.buildUrl}" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">
                  <span>${t('btnBuild')}</span>
                  <span>↗</span>
                </a>
              ` : ''}
              <a href="${backUrl}" class="btn btn-ghost">
                ${t('btnBackToShelf')}
              </a>
            </footer>
          </article>

          <!-- Lightbox Modal para Visualização em Tela Cheia -->
          <div id="project-lightbox" class="lightbox-modal" role="dialog" aria-modal="true" aria-hidden="true">
            <div class="lightbox-wrapper">
              <button type="button" class="lightbox-close-btn" aria-label="${t('lightboxClose')}">&times;</button>
              <div class="lightbox-stage">
                <button type="button" class="lightbox-nav-btn prev" aria-label="${t('lightboxPrev')}">&#8249;</button>
                <img id="lightbox-img" class="lightbox-image" src="" alt="">
                <button type="button" class="lightbox-nav-btn next" aria-label="${t('lightboxNext')}">&#8250;</button>
              </div>
              <div class="lightbox-caption-bar">
                <div id="lightbox-caption" class="lightbox-caption-text"></div>
                <div id="lightbox-counter" class="lightbox-counter"></div>
              </div>
            </div>
          </div>
        `;

        // Vincular eventos de clique da galeria
        document.querySelectorAll('.gallery-card').forEach(card => {
          card.addEventListener('click', () => {
            const idx = parseInt(card.getAttribute('data-gallery-index'), 10);
            openLightbox(idx);
          });
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              const idx = parseInt(card.getAttribute('data-gallery-index'), 10);
              openLightbox(idx);
            }
          });
        });

        // Controles do Lightbox
        const closeBtn = document.querySelector('.lightbox-close-btn');
        if (closeBtn) closeBtn.addEventListener('click', closeLightbox);

        const nextBtn = document.querySelector('.lightbox-nav-btn.next');
        if (nextBtn) nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextLightboxImage(); });

        const prevBtn = document.querySelector('.lightbox-nav-btn.prev');
        if (prevBtn) prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevLightboxImage(); });

        const modal = document.getElementById('project-lightbox');
        if (modal) {
          modal.addEventListener('click', (e) => {
            if (e.target === modal || e.target.classList.contains('lightbox-wrapper') || e.target.classList.contains('lightbox-stage')) {
              closeLightbox();
            }
          });
        }
      }

      // Atalhos globais de teclado para Lightbox
      window.addEventListener('keydown', (e) => {
        const modal = document.getElementById('project-lightbox');
        if (!modal || !modal.classList.contains('active')) return;

        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowRight') {
          nextLightboxImage();
        } else if (e.key === 'ArrowLeft') {
          prevLightboxImage();
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        initI18n();
        renderCaseStudy();

        window.addEventListener('languageChanged', () => {
          renderCaseStudy();
        });
      });
    </script>
</body>
</html>
