<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Software Shelf — Catálogo central de softwares, ferramentas e assets do Cozy Developer Laboratory.">
    <title>Software Shelf | Germano Cozy Dev Lab</title>
    <!-- Metatags de Compartilhamento / Open Graph & Twitter Cards -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Germano | Cozy Dev Lab">
    <meta property="og:title" content="Software Shelf | Germano Cozy Dev Lab">
    <meta property="og:description" content="Software Shelf — Catálogo central de softwares, ferramentas e assets do Cozy Developer Laboratory.">
    <meta property="og:url" content="https://germano123.github.io/software-shelf.html">
    <meta property="og:image" content="https://github.com/Germano123.png">
    <meta property="og:image:secure_url" content="https://github.com/Germano123.png">
    <meta property="og:image:alt" content="Germano Gomes — Cozy Developer Laboratory">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="460">
    <meta property="og:image:height" content="460">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Software Shelf | Germano Cozy Dev Lab">
    <meta name="twitter:description" content="Software Shelf — Catálogo central de softwares, ferramentas e assets do Cozy Developer Laboratory.">
    <meta name="twitter:image" content="https://github.com/Germano123.png">
    <meta name="twitter:image:alt" content="Germano Gomes — Cozy Developer Laboratory">
    <!-- Google Fonts for Cozy Rounded Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header id="site-header-mount"></header>

    <main class="page-shell">
        <!-- Cabeçalho da Área -->
        <section class="section-header">
            <h1 class="section-title">
                <span>📚</span>
                <span data-i18n="softwareShelfTitle">Software Shelf</span>
            </h1>
            <p class="section-desc" data-i18n="softwareShelfTagline">
                Catálogo completo de softwares, ferramentas e utilitários desenvolvidos com rigor técnico e foco em usabilidade.
            </p>
        </section>

        <!-- Controles de Busca e Filtros -->
        <section class="catalog-controls">
            <div class="search-input-wrapper">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input type="text" id="catalog-search" class="search-input" placeholder="Pesquisar por nome, tecnologia ou palavra-chave..." data-i18n-placeholder="searchPlaceholder" aria-label="Pesquisar projetos">
            </div>

            <div class="filter-pills" id="area-filter-pills" role="group" aria-label="Filtro por Área">
                <button type="button" class="filter-pill active" data-area="all" data-i18n="filterAllAreas">Todas as Áreas</button>
                <button type="button" class="filter-pill" data-area="tools-lab" data-i18n="navTools">Tools Lab</button>
                <button type="button" class="filter-pill" data-area="art-workshop" data-i18n="navArt">Art Workshop</button>
                <button type="button" class="filter-pill" data-area="games-prototypes" data-i18n="navGamesPrototypes">Games & Prototypes</button>
            </div>
        </section>

        <!-- Grid de Projetos Filtrados -->
        <section>
            <div class="projects-grid" id="catalog-projects-mount"></div>
        </section>
    </main>

    <footer id="site-footer-mount"></footer>

    <!-- Scripts da Aplicação -->
    <script src="js/data/projects.js"></script>
    <script src="js/data/tools.js"></script>
    <script src="js/data/areas.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/projects-service.js"></script>
    <script src="js/components.js"></script>

    <script>
      let currentArea = 'all';
      let searchQuery = '';

      function getInitialArea() {
        const params = new URLSearchParams(window.location.search);
        let areaParam = params.get('area');
        if (areaParam === 'game-systems') areaParam = 'games-prototypes';
        const validAreas = ['all', 'tools-lab', 'art-workshop', 'games-prototypes'];
        return validAreas.includes(areaParam) ? areaParam : 'all';
      }

      function updateAreaPillsUI() {
        document.querySelectorAll('#area-filter-pills .filter-pill').forEach(btn => {
          const isSelected = btn.getAttribute('data-area') === currentArea;
          btn.classList.toggle('active', isSelected);
          btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        });
      }

      function renderCatalog() {
        Components.renderHeader('shelf');
        Components.renderFooter();
        updateAreaPillsUI();

        const mount = document.getElementById('catalog-projects-mount');
        if (!mount || typeof ProjectsService === 'undefined') return;

        const allProjects = ProjectsService.getAllPublished();
        const filtered = ProjectsService.filterProjects(allProjects, {
          query: searchQuery,
          area: currentArea
        });

        if (filtered.length === 0) {
          mount.innerHTML = `
            <div style="grid-column: 1 / -1;">
              ${Components.renderEmptyState(t('noProjectsFoundTitle'), t('noProjectsFoundDesc'), '🔍')}
            </div>
          `;
        } else {
          mount.innerHTML = filtered.map(p => Components.renderProjectCard(p)).join('');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        initI18n();
        currentArea = getInitialArea();
        renderCatalog();

        // Evento de busca por texto
        const searchInput = document.getElementById('catalog-search');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderCatalog();
          });
        }

        // Filtro por botões de área
        document.querySelectorAll('#area-filter-pills .filter-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            currentArea = btn.getAttribute('data-area') || 'all';

            // Atualizar URL sem recarregar a página
            const url = new URL(window.location);
            if (currentArea === 'all') {
              url.searchParams.delete('area');
            } else {
              url.searchParams.set('area', currentArea);
            }
            window.history.replaceState({}, '', url);

            renderCatalog();
          });
        });

        window.addEventListener('languageChanged', () => {
          renderCatalog();
        });
      });
    </script>
</body>
</html>
