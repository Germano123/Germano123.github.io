<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Games & Prototypes — Jogos autorais, protótipos de mecânicas e experimentos interativos no Cozy Dev Lab.">
    <title>Games & Prototypes | Germano Cozy Dev Lab</title>
    <!-- Google Fonts for Cozy Rounded Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header id="site-header-mount"></header>

    <main class="page-shell">
        <section class="section-header">
            <h1 class="section-title">
                <span>🎮</span>
                <span data-i18n="gamesPrototypesTitle">Games & Prototypes</span>
            </h1>
            <p class="section-desc" data-i18n="gamesPrototypesTagline">
                Jogos autorais, protótipos de mecânicas e experimentos interativos focados em game feel e atmosfera acolhedora.
            </p>
        </section>

        <!-- Filtros Rápidos de Natureza / Parceria -->
        <section class="catalog-controls" style="padding: 16px 20px;">
            <div class="filter-pills" id="games-filter-pills" role="group" aria-label="Filtrar Jogos">
                <button type="button" class="filter-pill active" data-filter="all">
                    <span data-i18n="filterAll">Todos</span> <span class="filter-count" id="count-all">(6)</span>
                </button>
                <button type="button" class="filter-pill" data-filter="parceria">
                    <span>🤝</span> <span data-i18n="filterPartnerships">Parcerias</span> <span class="filter-count" id="count-parceria">(3)</span>
                </button>
                <button type="button" class="filter-pill" data-filter="portfolio">
                    <span>📁</span> <span data-i18n="filterPortfolio">Portfólio</span> <span class="filter-count" id="count-portfolio">(2)</span>
                </button>
                <button type="button" class="filter-pill" data-filter="comercial">
                    <span>💼</span> <span data-i18n="filterCommercial">Comercial</span> <span class="filter-count" id="count-comercial">(1)</span>
                </button>
                <button type="button" class="filter-pill" data-filter="estudo">
                    <span>📖</span> <span data-i18n="filterStudies">Estudos</span> <span class="filter-count" id="count-estudo">(0)</span>
                </button>
            </div>
        </section>

        <section>
            <div class="projects-grid" id="games-projects-mount"></div>
        </section>
    </main>

    <footer id="site-footer-mount"></footer>

    <!-- Scripts da Aplicação -->
    <script src="js/data/projects.js"></script>
    <script src="js/data/tools.js"></script>
    <script src="js/data/areas.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/projects-service.js"></script>
    <script src="js/components.js"></script>

    <script>
      let activeFilter = 'all';

      function updateFilterUI() {
        document.querySelectorAll('#games-filter-pills .filter-pill').forEach(btn => {
          const isSelected = btn.getAttribute('data-filter') === activeFilter;
          btn.classList.toggle('active', isSelected);
          btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
        });
      }

      function renderGamesPrototypes() {
        Components.renderHeader('games-prototypes');
        Components.renderFooter();
        updateFilterUI();

        const mount = document.getElementById('games-projects-mount');
        if (!mount || typeof ProjectsService === 'undefined') return;

        let projects = ProjectsService.getByArea('games-prototypes');
        
        // Atualizar contadores
        const allCount = projects.length;
        const parceriaCount = projects.filter(p => p.collaborationType === 'parceria').length;
        const portfolioCount = projects.filter(p => p.collaborationType === 'portfolio' || p.collaborationType === 'pessoal').length;
        const comercialCount = projects.filter(p => p.collaborationType === 'comercial').length;
        const estudoCount = projects.filter(p => p.collaborationType === 'estudo').length;

        const countAllEl = document.getElementById('count-all');
        if (countAllEl) countAllEl.textContent = `(${allCount})`;
        const countParceriaEl = document.getElementById('count-parceria');
        if (countParceriaEl) countParceriaEl.textContent = `(${parceriaCount})`;
        const countPortfolioEl = document.getElementById('count-portfolio');
        if (countPortfolioEl) countPortfolioEl.textContent = `(${portfolioCount})`;
        const countComercialEl = document.getElementById('count-comercial');
        if (countComercialEl) countComercialEl.textContent = `(${comercialCount})`;
        const countEstudoEl = document.getElementById('count-estudo');
        if (countEstudoEl) countEstudoEl.textContent = `(${estudoCount})`;

        if (activeFilter !== 'all') {
          if (activeFilter === 'portfolio' || activeFilter === 'pessoal') {
            projects = projects.filter(p => p.collaborationType === 'portfolio' || p.collaborationType === 'pessoal');
          } else {
            projects = projects.filter(p => p.collaborationType === activeFilter);
          }
        }

        if (projects.length === 0) {
          mount.innerHTML = `
            <div style="grid-column: 1 / -1;">
              ${Components.renderEmptyState(t('emptyAreaTitle'), t('emptyAreaDesc'), '🎮')}
            </div>
          `;
        } else {
          mount.innerHTML = projects.map(p => Components.renderProjectCard(p)).join('');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        initI18n();
        renderGamesPrototypes();

        // Escutar cliques nos filtros
        document.querySelectorAll('#games-filter-pills .filter-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            activeFilter = btn.getAttribute('data-filter') || 'all';
            renderGamesPrototypes();
          });
        });

        window.addEventListener('languageChanged', () => {
          renderGamesPrototypes();
        });
      });
    </script>
</body>
</html>
