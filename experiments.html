<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Experiments — Provas de conceito, protótipos e testes exploratórios no Cozy Dev Lab.">
    <title>Experiments | Germano Cozy Dev Lab</title>
    <!-- Google Fonts for Cozy Rounded Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <header id="site-header-mount"></header>

    <main class="page-shell">
        <section class="section-header">
            <h1 class="section-title">
                <span>🧪</span>
                <span>Experiments</span>
            </h1>
            <p class="section-desc">
                Provas de conceito, benchmarks e protótipos de exploração rápida para validação de hipóteses técnicas e mecânicas inusitadas.
            </p>
        </section>

        <section>
            <div class="projects-grid" id="experiments-projects-mount"></div>
        </section>
    </main>

    <footer id="site-footer-mount"></footer>

    <!-- Scripts da Aplicação -->
    <script src="js/data/projects.js"></script>
    <script src="js/data/areas.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/projects-service.js"></script>
    <script src="js/components.js"></script>

    <script>
      function renderExperiments() {
        Components.renderHeader('tools');
        Components.renderFooter();

        const mount = document.getElementById('experiments-projects-mount');
        if (!mount || typeof ProjectsService === 'undefined') return;

        const projects = ProjectsService.getByArea('experiments');
        if (projects.length === 0) {
          mount.innerHTML = `
            <div style="grid-column: 1 / -1;">
              ${Components.renderEmptyState(
                'Bancada de Experimentos em Preparação',
                'Espaço dedicado a protótipos e benchmarks sem compromisso comercial. Novos testes de estresse e protótipos de mecânicas serão expostos em breve.',
                '🧪'
              )}
            </div>
          `;
        } else {
          mount.innerHTML = projects.map(p => Components.renderProjectCard(p)).join('');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        initI18n();
        renderExperiments();

        window.addEventListener('languageChanged', () => {
          renderExperiments();
        });
      });
    </script>
</body>
</html>
