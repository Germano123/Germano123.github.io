  </defs>
  <rect width="1200" height="675" fill="url(#bg-gameflow-connect-gallery-3)"/>
  <rect x="40" y="40" width="1120" height="595" rx="24" fill="none" stroke="#3d352e" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Círculo Central e Ícone -->
