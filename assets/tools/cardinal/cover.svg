  <text x="600" y="600" font-size="13" fill="#8a5c33" text-anchor="middle" font-family="JetBrains Mono, monospace">COZY DEVELOPER LABORATORY • TOOLS LAB • WORLD SIMULATION &amp; PROCEDURAL ASSETS</text>
