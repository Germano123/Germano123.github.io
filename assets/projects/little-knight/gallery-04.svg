<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bg-little-knight" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#26201b"/>
      <stop offset="100%" stop-color="#141211"/>
    </radialGradient>
    <linearGradient id="accent-little-knight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c8813b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg-little-knight)"/>
  <rect x="40" y="40" width="1120" height="595" rx="24" fill="none" stroke="#3d352e" stroke-width="2" />
  
  <!-- Círculo Central e Ícone -->
  <circle cx="600" cy="240" r="105" fill="rgba(200, 129, 59, 0.08)" stroke="#f97316" stroke-width="3"/>
  <text x="600" y="272" font-size="90" text-anchor="middle" font-family="sans-serif">🗡️</text>
  
  <!-- Título do Projeto -->
  <text x="600" y="400" font-size="44" font-weight="bold" fill="#ede3d4" text-anchor="middle" font-family="Fredoka, sans-serif">Little Knight</text>
  <rect x="360" y="425" width="480" height="4" rx="2" fill="url(#accent-little-knight)"/>
  
  <!-- Subtítulo / Detalhe -->
  <text x="600" y="470" font-size="22" font-weight="500" fill="#f97316" text-anchor="middle" font-family="Fredoka, sans-serif">Ficha de Personagem & Mapa de Biomas</text>
  
  <!-- Badge do Tipo de Capa ou Slide -->
  <g transform="translate(600, 520)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1.5"/>
    <text x="0" y="6" font-size="14" font-weight="bold" fill="#f97316" text-anchor="middle" font-family="JetBrains Mono, monospace" letter-spacing="1.5">Ficha de Personagem & Mapa de Biomas</text>
  </g>
  
  <text x="600" y="590" font-size="14" fill="#a89f91" text-anchor="middle" font-family="JetBrains Mono, monospace">COZY DEV LAB • ATIVOS DE DESENVOLVIMENTO</text>
</svg>